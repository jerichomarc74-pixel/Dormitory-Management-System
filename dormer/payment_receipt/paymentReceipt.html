<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment | Leyte Normal University Dormitory</title>

    <!-- All styling lives in paymentReceipt.css -->
    <link rel="stylesheet" href="paymentReceipt.css">
</head>

<body>

    <!-- ========== HEADER: menu button, logo, page title ========== -->
    <header class="site-header">
        <button class="menu-btn" type="button" aria-label="Open menu">&#9776;</button>
        <img class="logo" src="logo.jpg" alt="Leyte Normal University seal">
        <div>
            <h1>Payment</h1>
            <p class="subtitle">Dormitory Monitoring System</p>
        </div>
    </header>

    <main class="page">

        <!-- ========== 1. UPLOAD FORM ========== -->
        <section class="card">
            <h2>Upload Proof of Payment</h2>
            <p class="hint">
                Upload a clear photo or screenshot of your receipt.
                JPG or PNG only, up to 5 MB.
            </p>

            <!-- The form posts to payment_receipt.php (field name: proof_image) -->
            <form id="paymentForm"
                  action="payment_receipt.php"
                  method="POST"
                  enctype="multipart/form-data">

                <!-- Choose the image -->
                <div class="upload-box">
                    <label for="proofImage">Select Payment Receipt</label>

                    <input type="file"
                           id="proofImage"
                           name="proof_image"
                           accept="image/jpeg,image/png"
                           required>

                    <!-- Shown by paymentReceipt.js when the chosen file is not allowed -->
                    <p id="fileError" class="error" role="alert" hidden></p>

                    <!-- Shown by paymentReceipt.js once a valid image is chosen -->
                    <div id="previewContainer" class="preview-container" hidden>
                        <p>Image Preview</p>
                        <img id="previewImage" src="" alt="Payment receipt preview">
                    </div>
                </div>

                <!-- Live date and time (for reference only; the server records the real upload time) -->
                <div class="date-time">
                    <p><b>Date:</b> <span id="currentDate"></span></p>
                    <p><b>Time:</b> <span id="currentTime"></span></p>
                </div>

                <button id="submitBtn" type="submit" class="btn btn-block">
                    Submit Payment Proof
                </button>
            </form>
        </section>

        <!-- ========== 2. PAYMENT HISTORY (opens and closes) ========== -->
        <details class="history-drawer" id="historyDrawer">
            <summary>
                <span>My Payment History <span id="historyCount"></span></span>
            </summary>

            <!-- Records are filled in by paymentReceipt.js -->
            <div class="history-content" id="paymentProofList">
                <p class="no-payments">Loading payment history...</p>
            </div>
        </details>

    </main>

    <script src="paymentReceipt.js"></script>
</body>
</html>
