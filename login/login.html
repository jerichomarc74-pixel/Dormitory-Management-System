
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login</title>
</head>
<body>

    <form action="login.php" method="POST">

        <h1>LOGIN</h1>

        <!-- Username / Email -->
        <label for="email">Email</label>
        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            required
        >

        <!-- Password -->
        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            required
        >

        <!-- Login Button -->
        <button type="submit">Login</button>


    </form>
        <button type="submit" onclick="window.location.href='verification_account.html'">signup</button>


</body>
</html>
